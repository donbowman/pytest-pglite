[project]
name = "pytest-pglite"
version = "0.2.0"
description = "Native PGlite (PostgreSQL in WebAssembly) for Python test suites, with first-class pytest integration"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Don Bowman", email = "don@agilicus.com" }]
keywords = ["pytest", "postgres", "postgresql", "pglite", "wasm", "wasmtime", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "wasmtime>=49.0,<50",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pytest>=9.1,<10",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.1,<3"]
async = ["psycopg[binary]>=3.3,<4"]
django = ["django>=6.1,<7", "pytest-django>=4.14,<5"]
examples = [
    "sqlalchemy[asyncio]>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "asyncpg>=0.31,<1",
    "fastapi>=0.142,<1",
    "httpx>=0.28,<1",
    "pytest-asyncio>=1.4,<2",
    "alembic>=1.16,<2",
]

[project.urls]
Homepage = "https://github.com/donbowman/pytest-pglite"
Repository = "https://github.com/donbowman/pytest-pglite"
Issues = "https://github.com/donbowman/pytest-pglite/issues"

[project.entry-points.pytest11]
pglite = "pytest_pglite.plugin"

[project.scripts]
pytest-pglite = "pytest_pglite.cli:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "pytest_pglite", from = "src" }]
include = [
    { path = "src/pytest_pglite/_wasm/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
psycopg = { version = ">=3.3,<4", extras = ["binary"] }
asyncpg = ">=0.31,<1"
sqlalchemy = { version = ">=2.1,<3", extras = ["asyncio"] }
fastapi = ">=0.142,<1"
httpx = ">=0.28,<1"
uvicorn = ">=0.54,<1"
django = ">=6.1,<7"
pytest-django = ">=4.14,<5"
pytest-asyncio = ">=1.4,<2"
pytest-xdist = ">=3.8,<4"
alembic = ">=1.16,<2"
black = ">=26.10,<27"
flake8 = ">=7.4,<8"
mypy = ">=2.4,<3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: tests that boot a real PGlite WASM instance",
    "slow: tests that are slower than usual",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["pytest_pglite"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["_wasm/"]

[tool.coverage.run]
source = ["pytest_pglite"]
