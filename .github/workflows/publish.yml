name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test-pypi:
        description: Publish to TestPyPI instead of PyPI
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    # GITHUB_TOKEN stays read only. The release is pushed with a short lived
    # GitHub App installation token, which is the actor allowed to bypass the
    # required-pull-request rule on main; see CONTRIBUTING.md.
    permissions:
      contents: read
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped to this repository, inheriting only what the release needs.
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Build the release bot's committer identity
        id: committer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug='${{ steps.app-token.outputs.app-slug }}'
          id=$(gh api "/users/${slug}[bot]" --jq .id)
          echo "name=${slug}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${slug}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - name: Determine the next version, commit, tag and release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # Distribution packages are built in a separate job from the tag.
          build: "false"
          git_committer_name: ${{ steps.committer.outputs.name }}
          git_committer_email: ${{ steps.committer.outputs.email }}

  build:
    name: Build distributions
    needs: [release]
    if: >-
      always() && (
        needs.release.outputs.released == 'true'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit the release tag points at.
          ref: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry
      - name: Build
        run: poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.test-pypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
